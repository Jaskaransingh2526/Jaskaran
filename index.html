<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaskaran Singh - 2436429</title>
    
    <!-- Load Inter font for clean typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: linear-gradient(to bottom right, #eef2ff, #ffffff, #faf5ff);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Profile Card */
        .profile-card {
            background-color: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(8, 112, 184, 0.07);
            border: 1px solid #f3f4f6;
            padding: 2.5rem;
            text-align: center;
            width: 100%;
            max-width: 28rem;
            transition: transform 0.5s ease;
        }

        .profile-card:hover {
            transform: translateY(-8px);
        }

        /* Avatar Container */
        .avatar-container {
            width: 7rem;
            height: 7rem;
            background: linear-gradient(to top right, #e0e7ff, #f3e8ff);
            border-radius: 50%;
            margin: 0 auto 2rem auto;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06), 0 0 0 4px #ffffff;
        }

        .avatar-icon {
            width: 3.5rem;
            height: 3.5rem;
            color: #6366f1;
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.05));
        }

        /* Typography */
        .profile-name {
            font-size: 2.25rem;
            font-weight: 800;
            color: #111827;
            letter-spacing: -0.025em;
            margin-bottom: 0.75rem;
            line-height: 1.2;
        }

        /* Roll Number Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(238, 242, 255, 0.8);
            border: 1px solid #e0e7ff;
            border-radius: 9999px;
            padding: 0.5rem 1.25rem;
            margin-top: 0.5rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .badge-icon {
            width: 1.25rem;
            height: 1.25rem;
            color: #6366f1;
            margin-right: 0.5rem;
        }

        .badge-text {
            font-size: 1.125rem;
            font-weight: 500;
            color: #3730a3;
        }

        .roll-number {
            font-weight: 700;
            letter-spacing: 0.025em;
            margin-left: 0.25rem;
        }

        /* Responsive padding for larger screens */
        @media (min-width: 640px) {
            .profile-card {
                padding: 3.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Profile Card Container -->
    <div class="profile-card">
        
        <!-- Avatar Icon -->
        <div class="avatar-container">
            <svg class="avatar-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>

        <!-- Name -->
        <h1 class="profile-name">
            Jaskaran Singh

        <!-- Roll Number Badge -->
        <div class="badge">
            <svg class="badge-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

            </svg>
            <p class="badge-text">
                Roll No: <span class="roll-number">2436429</span>

        </div>

    </div>

</body>
